name = "Meant Lang"
grammar = "meant"
path_suffixes = ["meant"]
line_comments = ["# "]
tab_size = 2
hard_tabs = false
word_characters = ["_"]
autoclose_before = ")]\""
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]
